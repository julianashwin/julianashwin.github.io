# Short bio shown on the home page (Markdown supported)
bio: |
  I am an Assistant Professor of Macroeconomics in the School of Business and Economics at
  Maastricht University. My research focuses on the economics of ageing and longevity,
  expectations formation and natural language processing methods.

  I am currently a Research Fellow at the [Ellison Institute of Technology](https://eit.org/)
  and at [Netspar](https://www.netspar.nl/).



